# Claude Code vs Stella on one Terminal-Bench task, run locally.
#
#   cd ~/Projects/stella/arenabench
#   ARENABENCH_STELLA_ADAPTER=$PWD/../bench/harbor_adapter \
#   uv run python -m arenabench run \
#     ~/Projects/stella/.stella/arenabench/fix-git-h2h.toml --progress
#
# Needs: colima running (`colima status`), OPENROUTER_API_KEY exported, and a
# staged SUT at ~/.arenabench/sut/<sut_ref>/stella. Build one with:
#
#   TB_REPO=<a checkout at that commit> TB_ROOT=/tmp/sutbuild \
#     bench/evidence/run/build_sut.sh <commit>
#
# The Claude Code seat fills CLAUDE_CODE_OAUTH_TOKEN from this machine's own
# Claude Code login at match creation — nothing to export. But the CLI rotates
# (and revokes) that token whenever any local session refreshes, so a long
# match can die on it mid-run.

[match]
name = "fix-git: Claude Code vs Stella"
dataset = "terminal-bench-2.1"
tasks = ["fix-git"]

# Bump this as you rebuild. main@9b1214d9d predates #2553, so research and plan
# still inherit the worker's xhigh on this binary.
sut_ref = "9b1214d9df4b0e6a70db040a02e04b7b51ec26c5"

attempts = 1
# One trial at a time. The agent ceiling is wall clock, so two trials racing for
# one machine manufacture the timeouts you are trying to measure.
concurrency = 1
record_video = false
# Image pulls are not the thing under test.
setup_timeout_multiplier = 4.0

[[contestant]]
id = "claude-code"
name = "Claude Code (Sonnet 5, xhigh)"
agent = "claude-code"
color = "#FF6B9D"

  [contestant.engine]
  api = "anthropic"
  model = "claude-sonnet-5"
  reasoning = true
  effort = "xhigh"

  [contestant.env]
  required = ["CLAUDE_CODE_OAUTH_TOKEN"]

[[contestant]]
id = "stella"
name = "Stella (Sonnet 5, xhigh, full pipeline)"
agent = "stella"
color = "#FFB000"

  [contestant.engine]
  api = "openrouter"
  model = "anthropic/claude-sonnet-5"
  reasoning = true
  effort = "xhigh"

    # Cross-family from the worker on purpose: a verifier running the worker's
    # own model is the worker grading itself.
    [contestant.engine.roles.verifier]
    model = "anthropic/claude-fable-5"
    effort = "xhigh"
    reasoning = "on"

    [contestant.engine.roles.triage]
    model = "anthropic/claude-haiku-4.5"
    effort = "low"
    reasoning = "off"

    # Only honoured on a SUT carrying #2553. On an older binary these two
    # silently inherit the worker's xhigh — which cost 76s of an 817s run.
    [contestant.engine.roles.research]
    model = "anthropic/claude-haiku-4.5"
    effort = "low"
    reasoning = "off"

    [contestant.engine.roles.plan]
    effort = "medium"
    reasoning = "on"

  [contestant.env]
  required = ["OPENROUTER_API_KEY"]

# No budget_usd and no max_tokens anywhere, on either arm or any role. A
# per-trial ceiling turns "the agent ran out of our money" into a task failure
# on the scoreboard, and only one seat would carry it — the arena refuses a
# match that declares one.
