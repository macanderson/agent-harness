# Stella custom command — `/backlog-triage`
#
# GENERATED — do not edit this file directly.
#
#   source:     .claude/commands/backlog-triage.md  (the same command, in
#               Claude Code's markdown spelling)
#   regenerate: python3 .claude/mk-command-toml.py \
#                 .claude/commands/backlog-triage.md \
#                 .stella/commands/backlog-triage.toml
#
# The two files are ONE command in two spellings, and stella parses both
# through a single field-extraction path. Editing the markdown and
# regenerating is what stops the two prompt bodies from drifting apart.
#
# Neither file is tracked: .gitignore excludes `.claude/` and `/.stella/*`,
# so both are deliberately local-only, and committing them would fail the
# gate's `no-scratch` guard.

name = "backlog-triage"
description = "Triage open GitHub issues to a fully-specified state — type, domain, priority, Impact, assignee, parent epic — and drop the triage label last."
argument-hint = "[issue numbers] [--limit N] [--dry-run]   (blank = the whole open triage queue)"
allowed-tools = ["Bash(gh:*)", "Bash(rg:*)", "Bash(fd:*)", "Bash(git:*)", "Bash(mkdir:*)", "Read", "Grep", "Glob", "Write"]

# Bulk, outward-facing mutation (labels, assignment, closes, epic creation),
# so this is deliberate-only: the user types it, the model never fires it
# mid-turn. Set to false to let the model invoke it.
disable-model-invocation = true

prompt = '''
# /backlog-triage

Triage open issues in `macanderson/stella` until each one is **fully specified**,
then take the `triage` label off — and only then.

**Argument received:** `$ARGUMENTS`

| Form | Meaning |
|---|---|
| *(empty)* | every open issue carrying `triage` |
| `2560 2559 2552` | exactly those issues, whether or not they carry `triage` |
| `--limit N` | the N **oldest** issues in the triage queue |
| `--dry-run` | decide everything, print the table, **write nothing** |

---

## The contract

An issue leaves triage only when **all six facets** hold:

| # | Facet | Where it lives | Rule |
|---|---|---|---|
| 1 | **Type** | label | exactly one of `bug` `feature` `chore` `documentation` `epic` |
| 2 | **Domain** | label | **one or more** `area:*` — every domain it truly touches |
| 3 | **Priority** | label | exactly one of `P0` `P1` `P2` `P3` `P4` |
| 4 | **Impact** | Project #6 Number field | integer 0–10 |
| 5 | **Assignee** | issue | `macanderson` |
| 6 | **Parent** | sub-issue link | an open epic. **No orphans.** |

> **`triage` comes off LAST, and only when all six hold.** It is the queue's
> membership marker, not a status. Removing it early is unrecoverable — the
> issue silently vanishes from every future sweep. This ordering is what makes
> the command safe to interrupt: a run killed halfway leaves its unfinished
> issues *still in the queue*, and re-running is a no-op on the ones it
> already finished.

---

## Setup — three gotchas that corrupt results silently

```sh
export CLICOLOR_FORCE=0    # gh colourises --json output; ANSI codes break every jq/parse downstream
```

- **Never post a body with `-b "..."`.** zsh command-substitutes backticks
  *inside double quotes*, so `` `flip_achieved` `` runs as a command, fails, and
  substitutes **empty**. `gh` still exits 0, so nothing looks wrong — only the
  posted comment is silently missing words. Write the body to a file and use
  `--body-file`.
- **`gh issue edit` accepts many issue numbers in one call**
  (`gh issue edit 2560 2559 2552 --add-label P1`). Use it for anything shared;
  it turns 90 calls into 3.
- **`gh issue list` cannot filter or sort on Impact** — it is a Projects v2
  field, invisible to the issue API. Read it from `gh project item-list`.

---

## Step 1 — build the work list

```sh
gh issue list --label triage --state open --limit 300 \
  --json number,title,createdAt,labels,assignees \
  --jq 'sort_by(.createdAt) | .[] | "#\(.number)\t\(.createdAt[:10])\t\(.title)"'
```

Apply `$ARGUMENTS` to narrow it. Print the list you are about to work and its
size before touching anything.

## Step 2 — build the epic roster **once**, not per issue

Epics are identified by **two** signals in this repo and they disagree — only
one epic carries the `epic` label, seven use an `Epic:` title convention:

```sh
gh issue list --state open --limit 400 --json number,title,labels \
  --jq '.[] | select((.labels|map(.name)|index("epic")) or (.title|test("Epic:";"i")))
        | "#\(.number) [\(.labels|map(.name)|join(","))] \(.title)"'
```

When you parent into a title-convention epic that lacks the label, **add
`epic` to it** so the two signals converge. That is a one-flag fix to a real
taxonomy split; leaving it makes the next run re-derive the same roster.

## Step 3 — read the issue, and check it is still real

Read the **full body and every comment** (`gh issue view N --comments`). Then
two early exits — triage is not only labelling:

- **Duplicate.** `gh search issues --repo macanderson/stella "<key terms>"`.
  If it duplicates an open issue: label `duplicate`, comment naming the
  survivor, close as `not planned`, remove `triage`. Merge any facet the
  duplicate has that the survivor lacks.
- **Already fixed.** A merged PR *mentioning* `#N` is weak evidence and usually
  points the wrong way — this repo's "nothing left behind" rule makes every PR
  list the issues it **filed as follow-ups**, so `PR #1699 mentions #1696` most
  often means #1699 *created* #1696. **Only the code settles it:** `rg` the exact
  symbols the issue names against `origin/main`. If genuinely fixed, close with
  the file:line as evidence.

If neither applies, it is a real issue — proceed.

## Step 4 — Facet 1 & 2: type and domain

**Type:** exactly one. The `triage` label's own description is the rule —
*"Untyped request — convert by adding bug / feature / epic"* — plus `chore`
and `documentation` for the non-user-facing cases.

**Domain:** every `area:*` the issue actually touches — **multiple is correct
and expected** for anything crossing a crate boundary. Route by the crate the
fix lands in, not the crate where the symptom shows:

| Crate | Label | | Crate | Label |
|---|---|---|---|---|
| `stella-core` | `area:core` | | `stella-mcp` | `area:mcp` |
| `stella-model` | `area:model` (+ `provider` for a vendor adapter) | | `stella-media` | `area:media` |
| `stella-tools` | `area:tools` | | `stella-fleet` | `area:fleet` |
| `stella-cli` | `area:cli` | | `stella-protocol` | `area:protocol` |
| `stella-tui` | `area:tui` | | `stella-serve` | `area:serve` |
| `stella-context` | `area:context` | | `stella-observatory` | `area:observatory` |
| `stella-store` | `area:store` | | `bench/`, arenabench | `area:bench` |
| `stella-graph` | `area:graph` | | docs, website | `area:docs` |
| `stella-pipeline` | `area:pipeline` | | CI, release, packaging | `area:ci` |

**Six crates have no label of their own** — `stella-home`, `stella-diag`,
`stella-diff`, `stella-engine`, `stella-runtime`, `stella-parity`. Route them
to the nearest (`area:core` for runtime/engine/parity, `area:protocol` for
diag/diff, `area:cli` for home) **and name the gap in your final report** — do
not invent a label mid-sweep.

**Optional but valuable, apply when they genuinely apply:**

- `goal:witness` `goal:traces` `goal:bench` `goal:engine` — the four pillars
  of provable self-improvement (#2211), in that priority order.
- `pain:*` — when the issue names a measurable regression
  (`token-efficiency`, `token-cache`, `wall-clock`, `resolve-rate`,
  `test-invalidator`, `false-positive`, `false-negative`).
- `blocked-on-pillars` — a correct future capability gated on a pillar landing
  first. Comment with **which** pillar it waits on.

## Step 5 — Facet 3: priority (*when*)

| Label | Meaning |
|---|---|
| `P0` | Drop everything — broken, or embarrassing in front of a user |
| `P1` | Important — next in line |
| `P2` | Polish — worth doing, not urgent |
| `P3` | Later — backlog |
| `P4` | Someday/maybe — speculative |

Two decided rules, reuse them rather than re-litigating:

1. **A defect that makes a conclusion untrustworthy outranks one that makes a
   run fail.** A failed run is visible and gets retried; a run that completes
   and publishes a *wrong number* spends the exact reputation the project
   exists to build. So false verdicts and trace mislabelling sit at P0 beside
   outright breakage. Its recurring sub-case: **a missing measurement must
   never render as a negative measurement.**
2. **Naming the goal does not make it P1.** A grand self-improvement epic that
   mines traces is `P2`/`P3` + `blocked-on-pillars` while the witness does not
   fire honestly — it would train on a corrupted signal.

## Step 6 — Facet 4: Impact (*how much the number moves*)

**Impact is not priority.** Priority says *when*; Impact says **how much
closing this moves the Terminal-Bench 2.1 number against Claude Code.** They
routinely disagree: a red-`main` gate is `P0` / Impact 6, while "every
arenabench run to date is the control arm" (#2023) is `P1` / Impact 10.

| Score | Bar |
|---|---|
| 9–10 | Invalidates or unlocks the benchmark conclusion itself |
| 7–8 | Directly moves the solve rate, or the trustworthiness of its measurement, on real tasks |
| 5–6 | Unblocks work that moves the number; keeps `main`/the gate green; kills a large recurring cost |
| 3–4 | Bounded, measurable efficiency, latency or cost win |
| 1–2 | Developer ergonomics, docs, cleanup |
| 0 | No effect on the number |

Write it to Project #6 (`Stella Backlog`). **New issues are not auto-added** —
`item-add` first. It is idempotent, and returns the existing item id if the
issue is already on the board:

```sh
ITEM=$(gh project item-add 6 --owner macanderson \
         --url https://github.com/macanderson/stella/issues/<N> \
         --format json --jq '.id')

gh project item-edit --id "$ITEM" \
  --project-id PVT_kwHOAAhIoc4Bf27a \
  --field-id   PVTF_lAHOAAhIoc4Bf27azhaGvzU \
  --number     <0-10>

# Status → Todo, so the triaged issue is visible on the board
gh project item-edit --id "$ITEM" \
  --project-id PVT_kwHOAAhIoc4Bf27a \
  --field-id   PVTSSF_lAHOAAhIoc4Bf27azhaGvwM \
  --single-select-option-id f75ad846
```

**Never mirror Impact into a label.** One number in two places is exactly how
this repo's file-size limit died.

## Step 7 — Facet 5: a parent epic. No orphans.

```sh
gh issue edit <N> --parent <EPIC>
```

Choose by **scope, not by shared label.** An epic about folding TUI views into
a HARNESS tab does not adopt an unrelated TUI rendering bug merely because both
carry `area:tui`. The epic's stated outcome must actually contain this issue's
outcome.

**An epic itself has no parent.** That is the legal base case — do not chase it.

If no epic fits, in this order:

1. **Create one — when it is genuinely warranted.** The bar: **at least three
   open issues** share one coherent outcome and no epic covers it. Title it
   `Epic: <the outcome>`, label it `epic` + the shared `area:*` + a priority
   equal to the highest of its children, and give it a body that states the
   outcome, the definition of done, and the child list. Then parent all of them
   — not just the one in front of you.
2. **Otherwise the issue is an orphan, and an orphan is a triage defect, not a
   silent skip.** It **keeps its `triage` label** and is recorded on the
   standing orphan tracker:

   ```sh
   gh issue list --state open --search 'in:title "Triage defect: unparented issues"' \
     --json number --jq '.[0].number'
   ```

   Append the issue number and one line on why nothing fit. If the tracker does
   not exist, create it (`epic`-adjacent, `area:ci`, `P2`) and say so in your
   report. **Never** invent a thin single-issue epic just to satisfy the rule —
   that trades an honest orphan for a dishonest hierarchy.

## Step 8 — Facet 6, and the last write

Only for issues where **all five prior facets now hold**. One batched call, so
assignment and de-queueing succeed or fail together:

```sh
gh issue edit <all passing numbers> --add-assignee macanderson --remove-label triage
```

Anything that failed any facet keeps `triage` and appears in the report as
unfinished, with the reason.

## Step 9 — leave the evidence, then report

**Comment only where the decision is non-obvious** — labels speak for
themselves otherwise, and 17 boilerplate comments are noise. Post a short
rationale (via `--body-file`) when:

- priority is `P0` or `P1`, or Impact ≥ 7 — say what makes it that;
- the issue was closed as duplicate or already-fixed — cite the survivor, or
  the `file:line` proving the fix;
- a new epic was created, or `blocked-on-pillars` was applied — name the pillar.

Then print one table:

| # | Type | Areas | P | Impact | Parent | Outcome |
|---|---|---|---|---|---|---|

and below it, explicitly:

- **Orphans** — kept `triage`, with the reason each one had no home.
- **Early exits** — closed as duplicate / already fixed, with the evidence.
- **Epics created**, and the children moved under each.
- **Taxonomy gaps hit** — the six unlabelled crates, or any `area:*` you
  wanted and did not find.

State the unflattering count plainly: how many entered the queue, how many left
it, and how many did not. A sweep that reports only its successes is a sweep
that will be re-run blind.
'''
