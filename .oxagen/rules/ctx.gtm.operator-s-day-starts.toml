kind = "fact"
statement = "An operator's day starts from the work. A release needs notes, a bug report needs a fix, a finding says a cache write is never read. The rev1 design opens on a run log instead. Work sits on a Tasks page, steering sits on five shelves and four tabs, and the question an operator asks after every run, why it did that, has five partial answers: the Context, Policy and Governed actions tabs of the run, the Compiler, and the agent's Steering tab. The wedge puts the work first and gives each run one explanation. The operator picks work, sends it to an agent under a mandate, follows the runs it produces, and reads why each run did what it did. Oxagen still does not run the agent (ADR-043). It hands the agent its brief and its steering, answers its governed calls, and keeps the record. This spec is the design authority for the change. `fleet-operations-ia.md` lays out every view, [`fleet-operations-routes.md`](https://github.com/macanderson/oxagen-roadmap/blob/469233e/docs/fleet-operations-routes.md) maps every old route, and [`fleet-operations-collapse.md`](https://github.com/macanderson/oxagen-roadmap/blob/469233e/docs/fleet-operations-collapse.md) lists what is deleted or merged. The page specs in `mockups/pages/` describe each view field by field."
